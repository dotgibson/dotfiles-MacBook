"$schema" = 'https://starship.rs/config-schema.json'

# Nord prompt — local macOS override. Core's vendored starship.toml keeps its
# own palette; STARSHIP_CONFIG points here from dotfiles-MacBook/zsh/zshrc.
# Hex values are Nord: bg #2E3440, surface #3B4252, fg #D8DEE9, accent #88C0D0.

add_newline = false
command_timeout = 1300

format = """
[](#3b4252)\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_status\
[](#3b4252)\
$fill\
[](#3b4252)\
$c$cpp$rust$golang$nodejs$bun$php$java$python$ruby$lua$package\
$container$docker_context$kubernetes$aws$conda$direnv\
$jobs$shlvl$shell$cmd_duration$memory_usage$sudo\
[](#3b4252)\
$line_break\
$character"""

continuation_prompt = "[∙](#4c566a) "

[username]
show_always = true
style_user = "bold #88c0d0"
style_root = "bold #bf616a"
format = '[$user ]($style)'

[hostname]
ssh_only = true
style = "bold #b48ead"
format = '[@$hostname ]($style)'

[directory]
style = "bold #81a1c1"
truncation_length = 3
truncate_to_repo = true
format = '[ $path ]($style)'

[git_branch]
symbol = "󰘬 "
style = "bold #d8dee9"

[git_commit]
only_detached = true
style = "#4c566a"
format = '[$hash]($style) '

[git_status]
style = "bold #d8dee9"
ahead = ' [](#88c0d0)[$count](#d8dee9)'
behind = ' [](#5e81ac)[$count](#d8dee9)'
conflicted = ' [=$count](#bf616a)'
deleted = ' [✘$count](#bf616a)'
diverged = ' [](#5e81ac)[$ahead_count](#d8dee9)[](#88c0d0)[$behind_count](#d8dee9)'
modified = ' [*$count](#ebcb8b)'
renamed = ' [»$count](#b48ead)'
staged = ' [+$count](#a3be8c)'
stashed = ' [\$$count](#d08770)'
untracked = ' [?$count](#8fbcbb)'

[nodejs]
symbol = "󰎙 "
style = "bold #a3be8c"

[python]
symbol = "󰌠 "
style = "bold #ebcb8b"

[ruby]
symbol = " "
style = "bold #bf616a"

[lua]
symbol = "󰓹 "
style = "bold #81a1c1"

[package]
disabled = true

[cmd_duration]
min_time = 2000
style = "bold #5e81ac"

[memory_usage]
disabled = true

[character]
success_symbol = '[❯](bold #a3be8c)'
error_symbol = '[❯](bold #bf616a)'
vicmd_symbol = '[❯](bold #88c0d0)'
